name: CEF for one platform
# Builds one platform's CEF minimal distribution with the proprietary codecs.
# Called by cef.yml once per platform.
#
# Chromium takes most of a day to build on a hosted runner, but a job may run
# for six hours. So the build is a chain of jobs: each one builds for about
# five hours, packs the whole tree (sources, toolchains, the half-built out
# directory) into an artifact, and the next job unpacks it and lets ninja carry
# on where it stopped. The job that finishes makes the distribution and uploads
# it as the artifact cef-distrib-<platform>; the jobs after it are skipped. The
# work itself is in scripts/cef-build.sh. A job that fails (a lost runner, a
# network error) can be re-run on its own with "Re-run failed jobs": the
# previous job's tree stays until the next one has uploaded its own.

on:
  workflow_call:
    inputs:
      platform: { type: string, required: true }
      runner: { type: string, required: true }
      cef_version: { type: string, required: true }
      cef_branch: { type: string, default: "" }
      cef_commit: { type: string, default: "" }
      gn_defines: { type: string, default: "" }
      pgo: { type: boolean, default: true }

defaults:
  run:
    shell: bash

env:
  PLATFORM: ${{ inputs.platform }}
  CEF_VERSION: ${{ inputs.cef_version }}
  CEF_BRANCH: ${{ inputs.cef_branch }}
  CEF_COMMIT: ${{ inputs.cef_commit }}
  GN_DEFINES_EXTRA: ${{ inputs.gn_defines }}
  CEF_PGO: ${{ inputs.pgo }}
  # The Xcode the macOS images use for Chromium 156. When the image no longer
  # has it, the image's default Xcode is used.
  XCODE_VERSION: "26.5"
  # A job may run for 360 minutes. Building stops 300 minutes after the job
  # started, which leaves time to pack and upload the tree.
  BUILD_UNTIL_MINUTE: "300"
  # The number of the last build job below. It fails if the build is still
  # not done; add jobs if that happens.
  LAST_PART: "16"

jobs:
  build-01:
    name: Fetch and build 01
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      PART: "01"
      PREVIOUS: ""
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - &clock
        name: Note when the job started
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - &checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # For automate-git.py; the images' default Python can be newer than
      # depot_tools supports.
      - &python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - &git
        name: Configure git for Chromium
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.filemode false

      - &prepare
        name: Prepare the runner (toolchain, disk space)
        run: scripts/cef-build.sh prepare

      - name: Fetch CEF and Chromium, patch and configure
        run: scripts/cef-build.sh fetch

      - &build
        name: Build
        id: build
        run: scripts/cef-build.sh build

      - &distrib
        name: Make the minimal distribution
        if: steps.build.outputs.status == 'finished'
        run: scripts/cef-build.sh distrib

      - &upload-distrib
        name: Upload the distribution
        if: steps.build.outputs.status == 'finished'
        uses: actions/upload-artifact@v4
        with:
          name: cef-distrib-${{ inputs.platform }}
          path: ${{ runner.temp }}/cef-distrib/
          if-no-files-found: error
          retention-days: 30

      - &save
        name: Pack the build tree for the next job
        if: steps.build.outputs.status == 'running'
        run: scripts/cef-build.sh save

      - &upload-state
        name: Upload the build tree
        if: steps.build.outputs.status == 'running'
        uses: actions/upload-artifact@v4
        with:
          name: cef-state-${{ inputs.platform }}-${{ env.PART }}
          path: ${{ runner.temp }}/cef-state/
          # Already zstd-compressed.
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - &drop-previous
        name: Delete the previous job's build tree
        if: steps.build.outputs.status == 'running' && env.PREVIOUS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/cef-build.sh drop-artifacts "cef-state-$PLATFORM-$PREVIOUS"

      - &out-of-jobs
        name: Give up when no job is left
        if: steps.build.outputs.status == 'running' && env.PART == env.LAST_PART
        run: |
          echo "::error::Not done after $LAST_PART jobs. Add build jobs to this workflow; the tree is in the artifact cef-state-$PLATFORM-$PART."
          exit 1

  build-02:
    name: Build 02
    needs: build-01
    if: needs.build-01.outputs.status == 'running'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      PART: "02"
      PREVIOUS: "01"
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps: &resume
      - *clock
      - *checkout
      - *python
      - *git
      - *prepare
      - name: Download the previous job's build tree
        uses: actions/download-artifact@v4
        with:
          name: cef-state-${{ inputs.platform }}-${{ env.PREVIOUS }}
          path: ${{ runner.temp }}/cef-state
      - name: Unpack it
        run: scripts/cef-build.sh restore
      - *build
      - *distrib
      - *upload-distrib
      - *save
      - *upload-state
      - *drop-previous
      - *out-of-jobs

  # The same as build-02, each one after the one before.
  build-03:
    name: Build 03
    needs: build-02
    if: needs.build-02.outputs.status == 'running'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env: { PART: "03", PREVIOUS: "02" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-04:
    name: Build 04
    needs: build-03
    if: needs.build-03.outputs.status == 'running'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env: { PART: "04", PREVIOUS: "03" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-05:
    name: Build 05
    needs: build-04
    if: needs.build-04.outputs.status == 'running'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env: { PART: "05", PREVIOUS: "04" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-06:
    name: Build 06
    needs: build-05
    if: needs.build-05.outputs.status == 'running'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env: { PART: "06", PREVIOUS: "05" }
    outputs: { status: "${{ steps.build.outputs.status }}" }
    steps: *resume

  build-07:
    name: Build 07
    needs: build-06
    if: needs.build-06.outputs.status == 'running'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env: { PART: "07", PREVIOUS: "06" }
